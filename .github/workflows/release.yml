name: Release

# Publish on a version tag (vX.Y.Z). Pre-release tags (rc/a/b, e.g. v0.1.0rc1) go to TestPyPI; final tags go to PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Determine release channel
        id: meta
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # PEP 440 pre-release markers (rc/a/b) go to TestPyPI.
          case "$tag" in
            *rc*|*a[0-9]*|*b[0-9]*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)                      echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match pyproject version $pkg"
            exit 1
          fi
      - name: Build distributions
        run: uv build
      - name: Check package metadata
        run: uvx twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/totebag/
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing (no API token stored)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/totebag/
    permissions:
      id-token: write # OIDC token for TestPyPI Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: GitHub Release
    needs: [build, pypi, testpypi]
    if: always() && startsWith(github.ref, 'refs/tags/') && (needs.pypi.result == 'success' || needs.testpypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the built distributions
    steps:
      - uses: actions/checkout@v7
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull the section under "## [<version>]" up to the next "## " heading.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## / {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG section for $version; using generated notes."
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          GENERATE: ${{ steps.notes.outputs.generate }}
        run: |
          args=("${GITHUB_REF_NAME}" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME")
          if [ "$GENERATE" = "true" ]; then args+=(--generate-notes); else args+=(--notes-file release-notes.md); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
